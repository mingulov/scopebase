# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-bpf"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
build = false
readme = "README.md"
description = "ScopeBase host BPF error and budget contracts"
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "src/**", "tests/**", "examples/**", "include/**", "fixtures/capability-v1/**", "fixtures/attach-v1/**", "fixtures/ring-v1/**", "fixtures/btf-v1/**", "fixtures/writer-v1/**", "fixtures/identity-v1/**"]
autotests = false
autoexamples = false

[features]
default = []
json = ["dep:serde", "dep:serde_json"]
# BP10 narrow existing-loader adapters (Aya/libbpf/bpfman-shape) over the
# BP04/BP05 attach seams with Arc<HeldFile> authority. Default off: no new
# mandatory dependency for host-only users.
adapters = ["dep:scopebase-linux"]
# BP10 real Aya binding: implements the narrow AyaUprobeShape seam over
# upstream aya =0.14.0 (registry, defaults off, no features). Compile-only
# here; live attach cells are NOT_RUN without a privileged kernel.
aya = ["adapters", "dep:aya"]
btf = ["dep:btf-rs"]
# BP08 optional producer task/exec identity route. Host identity values are
# always compiled; this feature binds the packaged C fixture route
# (include/scopebase/*.h, fixtures/identity-v1/producer.c) and its
# consistency checks. It pulls no BPF toolchain: host tests never invoke a
# compiler with or without this feature.
producer-fixtures = []

[dependencies]
scopebase-linux = { version = "=0.1.0", path = "../scopebase-linux", default-features = false, optional = true }
aya = { version = "=0.14.0", default-features = false, optional = true }
serde = { version = "=1.0.229", default-features = false, features = ["std"], optional = true }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"], optional = true }
# BP09 locked parser: retis-org/btf-rs at the SB02-probed revision (v2.0.0).
# default-features = false keeps elf/elf-compression/regex disabled; only the
# byte-slice constructors are used, never file/mmap backends.
btf-rs = { git = "https://github.com/retis-org/btf-rs", rev = "0a5838f8dad54b6da9a7b0539f1e2d7aeeb009a0", default-features = false, optional = true }
# Portable domain hashing for scopebase-bpf::btf (same admitted pin as before;
# moved from the x86_64-Linux-only section so pure BTF parsing stays host-only).
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
# BP05 retirement tests bind the real LX02 HeldFile authority (from_file
# adoption, AsFd borrows). Default production builds stay dependency-free;
# the optional BP10 `adapters` feature adds scopebase-linux for HeldFile
# authority (see [dependencies] above).
scopebase-linux = { version = "0.1.0", path = "../scopebase-linux" }
# BP10 seam-ratification test calls TC03/TC05 entry points as independent
# seams (dev-only; the production adapters never depend on the testkit).
scopebase-testkit = { version = "=0.1.0", path = "../scopebase-testkit", default-features = false, features = ["object"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu", target_pointer_width = "64", target_endian = "little"))'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process", "thread", "linux_4_11"] }
libc = { version = "=0.2.191", default-features = false, features = ["std"] }

