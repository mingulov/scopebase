# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-bpf"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
build = false
readme = "README.md"
description = "ScopeBase host BPF error and budget contracts"
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "src/**", "tests/**", "examples/**", "fixtures/capability-v1/**", "fixtures/attach-v1/**", "fixtures/ring-v1/**"]
autotests = false
autoexamples = false

[features]
default = []
json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"], optional = true }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"], optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu", target_pointer_width = "64", target_endian = "little"))'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process", "thread", "linux_4_11"] }
libc = { version = "=0.2.191", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }

[[test]]
name="api_contract"
path="tests/api_contract.rs"

[[test]]
name="maps_pure"
path="tests/maps_pure.rs"

[[test]]
name="maps_contract"
path="tests/maps_contract.rs"

[[test]]
name="maps_live"
path="tests/maps_live.rs"

[[test]]
name="maps_mounts"
path="tests/maps_mounts.rs"

[[test]]
name="who_preservation"
path="tests/who_preservation.rs"

[[example]]
name="possible_topology"
path="examples/possible_topology.rs"

[[example]]
name="who_map_reader"
path="examples/who_map_reader.rs"

[[example]]
name="bp02_live_fixture"
path="examples/bp02_live_fixture.rs"

[[test]]
name = "capability"
path = "tests/capability.rs"

[[test]]
name = "capability_json"
path = "tests/capability_json.rs"
required-features = ["json"]

[[example]]
name = "capability_cache"
path = "examples/capability_cache.rs"

[[example]]
name = "filter_assessment"
path = "examples/filter_assessment.rs"

[[test]]
name = "attach"
path = "tests/attach.rs"

[[test]]
name = "ring"
path = "tests/ring.rs"
