# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
build = false
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "src/lib.rs", "src/domain.rs", "src/error.rs", "src/quantity.rs", "src/conservation.rs", "src/time.rs", "tests/package_boundary.rs", "tests/support/check_package_boundary.py", "tests/domain_quantity.rs", "tests/time_domains.rs", "tests/ui/count_units_do_not_mix.rs", "tests/ui/count_units_match.rs", "tests/ui/sealed_unit.rs", "tests/ui/private_capture_id.rs"]

[features]
default = []
json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"], optional = true }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"], optional = true }
