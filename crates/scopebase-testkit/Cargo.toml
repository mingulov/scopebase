# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
build = false
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "src/**/*.rs", "tests/*.rs", "tests/fixtures/**", "oracle/**"]
[features]
default = []
bpf-host = ["dep:scopebase-bpf"]
bpf-host-json = ["bpf-host", "scopebase-bpf/json"]
linux-fixtures = ["dep:scopebase-linux", "dep:rustix", "dep:libc"]
[dependencies]
scopebase-bpf = { version = "=0.1.0", path = "../scopebase-bpf", default-features = false, optional = true }
scopebase-linux = { version = "=0.1.0", path = "../scopebase-linux", default-features = false, optional = true }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "pipe", "process", "event", "net", "time", "try_close"], optional = true }
libc = { version = "=0.2.191", default-features = false, features = ["std"], optional = true }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }

[[test]]
name = "bpf_host"
path = "tests/bpf_host.rs"
required-features = ["bpf-host"]

[[test]]
name = "tt02_rsp01_alloc"
path = "tests/tt02_rsp01_alloc.rs"
harness = false
required-features = ["bpf-host"]

[[test]]
name = "selection"
path = "tests/selection.rs"

[[test]]
name = "linux_fixture"
path = "tests/linux_fixture.rs"
required-features = ["linux-fixtures"]

[[bin]]
name = "scopebase-tt03-worker"
path = "src/bin/scopebase-tt03-worker.rs"
required-features = ["linux-fixtures"]
