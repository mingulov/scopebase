# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
build = false
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "src/**/*.rs", "tests/*.rs", "tests/fixtures/**"]
[features]
default = []
[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
