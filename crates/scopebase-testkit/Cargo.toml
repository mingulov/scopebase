# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
build = false
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "src/**/*.rs", "tests/*.rs", "tests/fixtures/**", "oracle/**"]
[features]
default = []
bpf-host = ["dep:scopebase-bpf"]
object = ["dep:scopebase-bpf", "scopebase-bpf/btf"]
# S85-round5: toolchain retirement pins the tool leader through the
# seccomp surface (no scopebase-linux edge — S78 preserved).
toolchain = ["object", "dep:libc", "seccomp-fixture"]
bpf-host-json = ["bpf-host", "scopebase-bpf/json"]
linux-fixtures = ["dep:scopebase-linux", "scopebase-linux/mapping", "dep:rustix", "dep:libc"]
# S78-round4: seccomp-only fixture surface (`fixture::linux::seccomp`)
# with no scopebase-linux edge, so scopebase-linux's own dev-dependency
# does not unify mapping/process back into its minimal test builds.
seccomp-fixture = ["dep:libc"]
[dependencies]
scopebase-bpf = { version = "=0.1.0", path = "../scopebase-bpf", default-features = false, optional = true }
scopebase-linux = { version = "=0.1.0", path = "../scopebase-linux", default-features = false, optional = true }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "pipe", "process", "event", "net", "time", "try_close"], optional = true }
libc = { version = "=0.2.191", default-features = false, features = ["std"], optional = true }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }

[[test]]
name = "bpf_host"
path = "tests/bpf_host.rs"
required-features = ["bpf-host"]

[[test]]
name = "tt02_rsp01_alloc"
path = "tests/tt02_rsp01_alloc.rs"
harness = false
required-features = ["bpf-host"]

[[test]]
name = "bpf_profile_schema"
path = "tests/bpf_profile_schema.rs"
required-features = ["object"]

[[test]]
name = "toolchain_invoke"
path = "tests/toolchain_invoke.rs"
required-features = ["toolchain"]

[[test]]
name = "toolchain_executor"
path = "tests/toolchain_executor.rs"
required-features = ["toolchain"]

[[test]]
name = "object_isa"
path = "tests/object_isa.rs"
required-features = ["object"]

[[test]]
name = "atomic_oracle"
path = "tests/atomic_oracle.rs"
required-features = ["object"]

[[test]]
name = "object_graph"
path = "tests/object_graph.rs"
required-features = ["object"]

[[test]]
name = "object_rules"
path = "tests/object_rules.rs"
required-features = ["object"]

[[test]]
name = "selection"
path = "tests/selection.rs"

[[test]]
name = "linux_fixture"
path = "tests/linux_fixture.rs"
required-features = ["linux-fixtures"]

[[test]]
name = "filesystem_cells"
path = "tests/filesystem_cells.rs"
required-features = ["linux-fixtures"]

[[test]]
name = "tt03_f_rows"
path = "tests/tt03_f_rows.rs"
required-features = ["linux-fixtures"]

[[test]]
name = "select_cli"
path = "tests/select_cli.rs"

[[bench]]
name = "contract_costs"
path = "benches/contract_costs.rs"
harness = false

[[bin]]
name = "scopebase-tt03-worker"
path = "src/bin/scopebase-tt03-worker.rs"
required-features = ["linux-fixtures"]

[[bin]]
name = "scopebase-tt04-audit-subject"
path = "src/bin/scopebase-tt04-audit-subject.rs"
required-features = ["linux-fixtures"]

[[bin]]
name = "scopebase-tt04-audit-denial"
path = "src/bin/scopebase-tt04-audit-denial.rs"
required-features = ["linux-fixtures"]

[[bin]]
name = "scopebase-tt03-seccomp-probe"
path = "src/bin/scopebase-tt03-seccomp-probe.rs"
required-features = ["linux-fixtures"]

[[bin]]
name = "scopebase-tc02-invoke-denial"
path = "src/bin/scopebase-tc02-invoke-denial.rs"
# S83-round5: the driver imports scopebase_bpf and the toolchain
# module — linux-fixtures alone selects it with unavailable
# imports. toolchain implies object (the BPF edge).
required-features = ["linux-fixtures", "toolchain"]

[[bin]]
name = "scopebase-pair-publisher"
path = "src/bin/scopebase-pair-publisher.rs"
required-features = ["linux-fixtures"]

[[bin]]
name = "scopebase-select"
path = "src/bin/scopebase-select.rs"
