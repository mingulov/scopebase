# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "ScopeBase retained file acquisition, bounded reads and strict raw-byte proc parsers"
publish = false
readme = "README.md"
build = false
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md"]

[features]
default = []
process = ["rustix/process", "rustix/event"]
mapping = ["process", "rustix/mm", "rustix/param"]
supervision = ["process"]
walk = []

[dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "pipe"] }

[[example]]
name = "fd_probe"
path = "tests/support/fd_probe.rs"

[[test]]
name = "proc_parsers"
path = "tests/proc_parsers.rs"

[[test]]
name = "process_observation"
path = "tests/process_observation.rs"
required-features = ["process"]

[[test]]
name = "mapping_contract"
path = "tests/mapping_contract.rs"
required-features = ["mapping"]
