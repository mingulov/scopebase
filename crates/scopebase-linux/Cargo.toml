# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "ScopeBase retained regular-file acquisition, bounded positional reads and descriptor observations"
publish = false
readme = "README.md"
build = false
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md"]

[features]
default = []
process = []
mapping = ["process"]
supervision = ["process"]
walk = []

[dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "pipe"] }

[[example]]
name = "fd_probe"
path = "tests/support/fd_probe.rs"
