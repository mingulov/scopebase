[package]
name = "scopebase-bpf-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "2"

[dependencies]
libfuzzer-sys = "=0.4.13"
scopebase-bpf = { path = "../../crates/scopebase-bpf", version = "=0.1.0", default-features = false, features = ["btf"] }

[[bin]]
name = "btf_parse"
path = "fuzz_targets/btf_parse.rs"
test = false
doc = false
bench = false
