# SPDX-License-Identifier: Apache-2.0
[package]
name = "scopebase-testkit-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "2"

[dependencies]
scopebase-testkit = { version = "=0.1.0", path = "../../crates/scopebase-testkit", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[[bin]]
name = "catalog_load"
path = "fuzz_targets/catalog_load.rs"
test = false
doc = false
bench = false
